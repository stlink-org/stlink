name: C/C++ CI

on:
  push:
    branches: [master, develop, testing]
  pull_request:
    branches: [master, develop, testing]

jobs:
  # Linux builds with GCC and Clang on Ubuntu 22.04 and 24.04
  linux_64_bit:
    strategy:
      fail-fast: false
      matrix:
        config:
          # === Ubuntu 22.04 (Jammy Jellyfish) ===
          # GCC versions
          - name: Ubuntu22.04_x64 gcc11
            os: ubuntu-22.04
            cc: gcc-11
            cxx: g++-11
            packages: gcc-11 g++-11

          - name: Ubuntu22.04_x64 gcc12
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            packages: gcc-12 g++-12

          # Clang versions
          - name: Ubuntu22.04_x64 clang14
            os: ubuntu-22.04
            cc: clang-14
            cxx: clang++-14
            packages: clang-14

          - name: Ubuntu22.04_x64 clang15
            os: ubuntu-22.04
            cc: clang-15
            cxx: clang++-15
            packages: clang-15

          # === Ubuntu 24.04 (Noble Numbat) ===
          # GCC versions
          - name: Ubuntu24.04_x64 gcc13
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13

          - name: Ubuntu24.04_x64 gcc14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            packages: gcc-14 g++-14

          # Clang versions
          - name: Ubuntu24.04_x64 clang16
            os: ubuntu-24.04
            cc: clang-16
            cxx: clang++-16
            packages: clang-16

          - name: Ubuntu24.04_x64 clang17
            os: ubuntu-24.04
            cc: clang-17
            cxx: clang++-17
            packages: clang-17

          - name: Ubuntu24.04_x64 clang18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            packages: clang-18

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt update && sudo apt-get install ${{ matrix.config.packages }} cmake libusb-1.0.0-dev libgtk-3-dev

      - name: Verify CMake version
        run: cmake --version

      - name: Prepare build directories
        run: mkdir -p ./build/{debug,release}

      - name: Configure project (Debug)
        working-directory: ./build/debug
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug

      - name: Build project (Debug)
        working-directory: ./build/debug
        run: cmake --build . --target all --parallel 4

      - name: Run tests (Debug)
        working-directory: ./build/debug
        run: ctest --force-new-ctest-process --parallel 4

      - name: Configure project (Release)
        working-directory: ./build/release
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build project (Release)
        working-directory: ./build/release
        run: cmake --build . --target all --parallel 4

      - name: Install project
        working-directory: ./build/release
        run: sudo cmake --build . --target install

      - name: Package project
        working-directory: ./build/release
        run: sudo cpack --config ./CPackSourceConfig.cmake ../debug/CPackSourceConfig.cmake

      - name: Uninstall project
        working-directory: ./build/release
        run: sudo cmake --build . --target uninstall

  # macOS builds with Clang (latest)
  macos_build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: macOS-latest clang15
            os: macos-latest
            cc: clang
            cxx: clang++
            packages: ""

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libusb cmake

      - name: Verify CMake version
        run: cmake --version

      - name: Prepare build directories
        run: mkdir -p ./build/{debug,release}

      - name: Configure project (Debug)
        working-directory: ./build/debug
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug

      - name: Build project (Debug)
        working-directory: ./build/debug
        run: cmake --build . --target all --parallel 4

      - name: Run tests (Debug)
        working-directory: ./build/debug
        run: ctest --force-new-ctest-process --parallel 4

      - name: Configure project (Release)
        working-directory: ./build/release
        run: cmake ../.. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build project (Release)
        working-directory: ./build/release
        run: cmake --build . --target all --parallel 4

      - name: Install project
        working-directory: ./build/release
        run: sudo cmake --build . --target install

      - name: Package project
        working-directory: ./build/release
        run: sudo cpack --config ./CPackSourceConfig.cmake ../debug/CPackSourceConfig.cmake

      - name: Uninstall project
        working-directory: ./build/release
        run: sudo cmake --build . --target uninstall

  # Windows builds with MSVC
  windows_build:
    name: Windows MSVC
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify CMake version
        run: cmake --version

      - name: Prepare build directories
        run: New-Item -ItemType Directory -Force -Path ./build/debug, ./build/release

      - name: Configure project (Debug)
        working-directory: ./build/debug
        run: >
          cmake ../.. -A x64 -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build project (Debug)
        working-directory: ./build/debug
        run: cmake --build . --config Debug --parallel 4

      - name: Run tests (Debug)
        working-directory: ./build/debug
        run: ctest --output-on-failure --build-config Debug --parallel 4

      - name: Configure project (Release)
        working-directory: ./build/release
        run: >
          cmake ../.. -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build project (Release)
        working-directory: ./build/release
        run: cmake --build . --config Release --parallel 4

      - name: Install project
        working-directory: ./build/release
        run: cmake --build . --config Release --target install

      - name: Package project
        working-directory: ./build/release
        run: cmake --build . --config Release --target package

      - name: Uninstall project
        working-directory: ./build/release
        run: cmake --build . --config Release --target uninstall

  # Cross-compilation for MinGW (Windows)
  mingw_cross_compile:
    name: MinGW Cross-Compilation (Windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 cmake autotools-dev libtool libusb-1.0-0-dev

      - name: Cross-compile for Windows
        run: |
          sudo sh ./gen_binaries_win.sh
